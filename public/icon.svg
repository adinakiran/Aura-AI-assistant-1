<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="#060d1a" stroke="url(#ringGrad)" stroke-width="14"/>

  <!-- Inner Dark Canvas -->
  <circle cx="256" cy="256" r="230" fill="#040b17"/>
  <circle cx="256" cy="256" r="210" fill="url(#auraGlow)"/>

  <!-- Teardrop Pin Shape -->
  <path d="M 256 110
           C 192 110, 142 160, 142 226
           C 142 292, 220 376, 256 404
           C 292 376, 370 292, 370 226
           C 370 160, 320 110, 256 110 Z"
        fill="url(#pinGrad)" />

  <!-- White Center Orb -->
  <circle cx="256" cy="230" r="46" fill="#ffffff"/>

  <!-- Lower Pill Accent -->
  <rect x="206" y="328" width="100" height="16" rx="8" fill="#38bdf8"/>
</svg>
