    <script>
      // Suppress harmless Vite HMR WebSocket connection logs in iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('[vite]') || e.message.includes('WebSocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      const _origErr = console.error;
      console.error = function(...args) {
        if (args[0] && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('WebSocket'))) {
          return;
        }
        _origErr.apply(console, args);
      };
    </script>

  <body class="bg-slate-100 text-slate-900 selection:bg-cyan-500/20 antialiased overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
